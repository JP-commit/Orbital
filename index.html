<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#030812" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Orbital – Space Survival</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #030812;
        font-family: 'Courier New', Courier, monospace;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Mobile Top Action Bar */
      #mobile-top-bar {
        position: absolute;
        top: 15px;
        left: 0;
        width: 100%;
        padding: 0 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
        z-index: 200;
      }
      .mobile-top-btn {
        pointer-events: auto;
        background: rgba(5, 15, 30, 0.85);
        border: 1.5px solid #00f0ff;
        color: #00f0ff;
        font-family: inherit;
        font-size: 12px;
        font-weight: bold;
        padding: 8px 14px;
        border-radius: 6px;
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: background 0.15s, transform 0.1s;
      }
      .mobile-top-btn:active {
        background: rgba(0, 240, 255, 0.4);
        transform: scale(0.95);
      }
      #btn-fullscreen {
        color: #ffe600;
        border-color: #ffe600;
        box-shadow: 0 0 10px rgba(255, 230, 0, 0.35);
      }
      #btn-fullscreen:active {
        background: rgba(255, 230, 0, 0.35);
      }

      /* Mobile Touch Virtual Controls */
      #mobile-controls {
        display: none; /* Shown dynamically or on touch */
        position: absolute;
        bottom: 25px;
        left: 0;
        width: 100%;
        padding: 0 25px;
        pointer-events: none;
        justify-content: space-between;
        align-items: flex-end;
        z-index: 100;
      }
      .touch-zone {
        pointer-events: auto;
      }
      #joystick-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      #joystick-label {
        color: rgba(0, 240, 255, 0.7);
        font-size: 10px;
        font-weight: bold;
        letter-spacing: 1px;
      }
      #joystick-area {
        width: 130px;
        height: 130px;
        background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(5, 15, 30, 0.6) 70%);
        border: 2px solid rgba(0, 240, 255, 0.4);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        touch-action: none;
      }
      #joystick-thumb {
        width: 50px;
        height: 50px;
        background: radial-gradient(circle, #00ffff 0%, #0088cc 100%);
        border: 2px solid #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 15px #00f0ff;
        position: absolute;
        transition: transform 0.05s ease-out;
        pointer-events: none;
      }
      .mobile-buttons {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .touch-btn {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        border: 2.5px solid #00f0ff;
        background: rgba(5, 15, 30, 0.8);
        color: #ffffff;
        font-family: inherit;
        font-weight: bold;
        font-size: 14px;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 14px rgba(0, 240, 255, 0.35);
        cursor: pointer;
        outline: none;
        touch-action: none;
        transition: transform 0.08s, background 0.1s;
      }
      .touch-btn:active, .touch-btn.active {
        transform: scale(0.92);
      }
      #touch-fire {
        background: rgba(255, 0, 85, 0.35);
        border-color: #ff0055;
        box-shadow: 0 0 16px rgba(255, 0, 85, 0.5);
      }
      #touch-fire:active, #touch-fire.active {
        background: rgba(255, 0, 85, 0.75);
        box-shadow: 0 0 24px rgba(255, 0, 85, 0.9);
      }
      #touch-brake {
        background: rgba(255, 179, 0, 0.3);
        border-color: #ffb300;
        box-shadow: 0 0 14px rgba(255, 179, 0, 0.4);
      }
      #touch-brake:active, #touch-brake.active {
        background: rgba(255, 179, 0, 0.7);
        box-shadow: 0 0 22px rgba(255, 179, 0, 0.85);
      }

      /* Mobile Game Over & Pause Actions */
      #mobile-overlay-actions {
        display: none;
        position: absolute;
        bottom: 22%;
        left: 50%;
        transform: translateX(-50%);
        flex-direction: column;
        gap: 12px;
        z-index: 250;
      }
      .mobile-modal-btn {
        background: rgba(5, 15, 30, 0.92);
        border: 2px solid #00f0ff;
        color: #ffffff;
        font-family: inherit;
        font-weight: bold;
        font-size: 15px;
        padding: 12px 28px;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        min-width: 220px;
        text-align: center;
        transition: background 0.15s, transform 0.1s;
      }
      .mobile-modal-btn:active {
        background: rgba(0, 240, 255, 0.4);
        transform: scale(0.96);
      }
      #btn-action-primary {
        border-color: #39ff14;
        color: #39ff14;
        box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
      }
      #btn-action-secondary {
        border-color: #ffe600;
        color: #ffe600;
        box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas"></canvas>

      <!-- Mobile Top Bar: Fullscreen, Settings, Pause -->
      <div id="mobile-top-bar">
        <button id="btn-fullscreen" class="mobile-top-btn" type="button">
          <span id="fs-icon">⛶</span> <span id="fs-label">FULLSCREEN</span>
        </button>
        <div style="display: flex; gap: 8px; pointer-events: auto;">
          <button id="btn-mobile-settings" class="mobile-top-btn" type="button" title="Mission Settings">⚙</button>
          <button id="btn-mobile-pause" class="mobile-top-btn" type="button" title="Pause Game">⏸</button>
        </div>
      </div>

      <!-- Mobile Touch Controls -->
      <div id="mobile-controls">
        <div id="joystick-container">
          <div id="joystick-area" class="touch-zone">
            <div id="joystick-thumb"></div>
          </div>
          <div id="joystick-label">THRUST / STEER</div>
        </div>
        <div class="mobile-buttons">
          <button id="touch-fire" class="touch-btn touch-zone" type="button">FIRE</button>
          <button id="touch-brake" class="touch-btn touch-zone" type="button">BRAKE</button>
        </div>
      </div>

      <!-- Mobile Game Over / Pause Touch Action Buttons -->
      <div id="mobile-overlay-actions">
        <button id="btn-action-primary" class="mobile-modal-btn" type="button">START MISSION</button>
        <button id="btn-action-secondary" class="mobile-modal-btn" type="button">REPLAY SEED</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
